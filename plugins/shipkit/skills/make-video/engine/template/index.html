<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
/* Styles for this video's own scenes. Use --vm-* colours and calc(var(--u) * N) sizes, never raw values. */
.chip { display: flex; align-items: center; gap: calc(var(--u) * 18); padding: calc(var(--u) * 22) calc(var(--u) * 30); font-size: calc(var(--u) * 44); font-weight: 600; white-space: nowrap; }
.chip b { color: var(--vm-error); font-size: calc(var(--u) * 32); }
.mark { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 40); }
.mark img { height: calc(var(--u) * 190); }
.mark .name { font-size: calc(var(--u) * 170); font-weight: 650; letter-spacing: -0.035em; line-height: 1; }
.vm-ground .mark img { background: var(--vm-on-ground); border-radius: calc(var(--u) * 46); padding: calc(var(--u) * 10); }
.panel { overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--u) * 26) calc(var(--u) * 36); border-bottom: 1px solid var(--vm-border); font-size: calc(var(--u) * 36); font-weight: 600; color: var(--vm-muted); }
.sysrow { display: flex; align-items: center; justify-content: space-between; height: calc(var(--u) * 116); padding: 0 calc(var(--u) * 36); border-bottom: 1px solid var(--vm-border); font-size: calc(var(--u) * 46); font-weight: 600; }
.sysrow:last-child { border-bottom: 0; }
.panel .vm-pill { font-size: calc(var(--u) * 32); }
.url { font-size: calc(var(--u) * 44); font-weight: 600; color: var(--vm-accent); text-align: center; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="build/timeline.js"></script>
<script src="/engine/lib/stage.js"></script>
<script>
const portrait = H > W;
const centreRow = (parent, y, html, cls = "") => {
  const box = at(el("div", cls, parent, html), 0, y);
  box.style.width = W + "px";
  return box;
};

// ---------- hook: the pain, already moving on frame 0 ----------
const hook = scene("hook");
const hookTitle = sayLine(hook.root, portrait ? H * .12 : H * .1, "hook", { highlight: ["hand"] });
const files = [["Report_v7_FINAL.xlsx", "Out of date"], ["RE: FW: numbers", "Conflict"], ["export (2).csv", "Which one?"]];
const chips = files.map(([name, badge], i) => {
  const c = el("div", "vm-card chip", hook.root, `${name}<b>${badge}</b>`);
  return at(c, portrait ? W * .1 : W * (.07 + .3 * i), portrait ? H * (.42 + i * .13) : H * (.5 + (i % 2) * .14));
});
onFrame(t => {
  if (!hook.visible(t)) return;
  hookTitle.update(t);
  const stress = prog(t, E("hook", -1.5), E("hook"));
  chips.forEach((c, i) => {
    const d = drift(t, i, 12 * U);
    pop(c, t, S("hook", -.3 + i * .12), { x: d.x + stress * 7 * U * Math.sin(t * 38 + i), y: d.y, r: Math.sin(t * 1.3 + i) * 3 });
  });
});

// ---------- turn: the product arrives on its own colour ----------
const turn = scene("turn");
turn.root.classList.add("vm-ground");
const mark = centreRow(turn.root, 0, `<img src="assets/logo.svg"><div class="name">Acme</div>`, "mark");
Object.assign(mark.style, { height: H + "px", flexDirection: portrait ? "column" : "row" });
const markImg = mark.querySelector("img"), markName = mark.querySelector(".name");
onFrame(t => {
  if (!turn.visible(t)) return;
  const pIn = ease.soft(prog(t, S("turn"), S("turn", .6)));
  const creep = lerp(1, 1.03, prog(t, S("turn", .6), E("turn")));
  place(markImg, { s: lerp(1.6, 1, pIn) * creep, o: clamp(prog(t, S("turn"), S("turn", .12))) });
  blur(markImg, pIn, 14 * U);
  const pWord = ease.soft(prog(t, S("turn", .25), S("turn", .85)));
  markName.style.clipPath = `inset(-10% ${100 - pWord * 100}% -10% 0)`;
  place(markName, { x: (1 - pWord) * -40 * U, s: creep, o: pWord > 0 ? 1 : 0 });
});

// ---------- feature: the product card is the hero, the words support it ----------
const feature = scene("feature");
const featTitle = sayLine(feature.root, portrait ? H * .1 : H * .08, "feature", { highlight: ["sync"], size: 80 });
const cardW = portrait ? W - 120 * U : W * .58;
const panel = at(el("div", "vm-card panel", feature.root), (W - cardW) / 2, portrait ? H * .36 : H * .3);
panel.style.width = cardW + "px";
const count = el("span", "vm-pill info", el("div", "panel-head", panel, "<span>Connected systems</span>"));
const systems = ["Sales", "Finance", "Warehouse", "Support"].map(name => {
  const row = el("div", "sysrow", panel, `<span>${name}</span><span class="vm-pill run">Syncing</span>`);
  return row.lastChild;
});
onFrame(t => {
  if (!feature.visible(t)) return;
  featTitle.update(t);
  const p = ease.soft(prog(t, S("feature"), S("feature", .5)));
  const push = lerp(1, 1.05, ease.inOut(prog(t, S("feature", .5), E("feature"))));
  place(panel, { y: (1 - p) * 40 * U, s: lerp(.94, 1, p) * push, o: clamp(prog(t, S("feature"), S("feature", .15))) });
  blur(panel, p);
  let done = 0;
  systems.forEach((pill, i) => {
    const ok = t >= Wd("feature", "sync", .2 + i * .28);
    done += ok;
    pill.className = "vm-pill " + (ok ? "ok" : "run");
    pill.textContent = ok ? "In sync" : "Syncing";
  });
  count.textContent = `${done} of 4`;
});

// ---------- call to action: last scene, so it never fades and its last frame is the thumbnail ----------
const cta = scene("cta");
const ctaMark = centreRow(cta.root, portrait ? H * .3 : H * .22, `<img src="assets/logo.svg"><div class="name" style="color: var(--vm-accent)">Acme</div>`, "mark");
const ctaTitle = sayLine(cta.root, portrait ? H * .52 : H * .55, "cta", { highlight: ["today"], size: 72 });
const url = centreRow(cta.root, portrait ? H * .64 : H * .72, "acme.example", "url");
onFrame(t => {
  if (!cta.visible(t)) return;
  const d = drift(t, 7, 4 * U);
  const p = ease.soft(prog(t, S("cta"), S("cta", .55)));
  place(ctaMark, { x: d.x, y: d.y, s: lerp(1.25, 1, p), o: clamp(prog(t, S("cta"), S("cta", .12))) });
  blur(ctaMark, p, 10 * U);
  ctaTitle.update(t);
  rise(url, t, LE("cta", -.2));
});
</script>
</body>
</html>
