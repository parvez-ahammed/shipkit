name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Check skill frontmatter
        shell: python
        run: |
          import pathlib, re, sys
          import yaml

          root = pathlib.Path("plugins/shipkit/skills")
          errors = []
          skills = sorted(p for p in root.glob("*/SKILL.md"))
          if not skills:
              errors.append(f"no SKILL.md files found under {root}")
          for path in skills:
              folder = path.parent.name
              text = path.read_text(encoding="utf-8")
              m = re.match(r"^---\r?\n(.*?)\r?\n---\r?\n?(.*)$", text, re.S)
              if not m:
                  errors.append(f"{path}: missing or unterminated YAML frontmatter")
                  continue
              try:
                  fm = yaml.safe_load(m.group(1)) or {}
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: frontmatter is not valid YAML: {exc}")
                  continue
              body_lines = len(m.group(2).splitlines())
              name = fm.get("name")
              desc = str(fm.get("description") or "")
              when = str(fm.get("when_to_use") or "")
              compat = fm.get("compatibility")
              if name != folder:
                  errors.append(f"{path}: name '{name}' does not match folder '{folder}'")
              if not desc:
                  errors.append(f"{path}: missing description")
              if len(desc) > 1024:
                  errors.append(f"{path}: description is {len(desc)} chars (max 1024)")
              if len(desc) + len(when) > 1536:
                  errors.append(f"{path}: description + when_to_use is {len(desc) + len(when)} chars (max 1536)")
              if not fm.get("license"):
                  errors.append(f"{path}: missing license")
              if compat is not None and len(str(compat)) > 500:
                  errors.append(f"{path}: compatibility is {len(str(compat))} chars (max 500)")
              if body_lines >= 500:
                  errors.append(f"{path}: body is {body_lines} lines (must be under 500)")
              print(f"{folder}: desc={len(desc)} desc+when={len(desc) + len(when)} body={body_lines} lines")
          if errors:
              print("\nFAILED:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print(f"\nOK: {len(skills)} skills passed")

      - name: Skill count and list match the docs
        shell: python
        run: |
          import json, pathlib, re, sys

          skills = sorted(p.parent.name for p in pathlib.Path("plugins/shipkit/skills").glob("*/SKILL.md"))
          n = len(skills)
          errors = []
          counted = ["README.md", "CONTRIBUTING.md", "docs/index.html", "docs/llms.txt", ".github/og-source.html"]
          listed = ["README.md", "INDEX.md", "docs/index.html", "docs/llms.txt"]
          for f in counted:
              text = pathlib.Path(f).read_text(encoding="utf-8")
              for found in re.findall(r"(?:\b|>)(\d+)(?:</b>)?\s+(?:Claude Code\s+)?skills\b", text):
                  if int(found) != n:
                      errors.append(f"{f}: says {found} skills, the plugin has {n}")
          for f in listed:
              text = pathlib.Path(f).read_text(encoding="utf-8")
              for s in skills:
                  if s not in text:
                      errors.append(f"{f}: does not mention skill '{s}'")
          for f in [".claude-plugin/marketplace.json", "plugins/shipkit/.claude-plugin/plugin.json"]:
              data = json.loads(pathlib.Path(f).read_text(encoding="utf-8"))
              descs = [data.get("description", "")] + [p.get("description", "") for p in data.get("plugins", [])]
              for d in descs:
                  for found in re.findall(r"\b(\d+) (?:production-ready )?(?:Claude Code )?skills\b", d):
                      if int(found) != n:
                          errors.append(f"{f}: description says {found} skills, the plugin has {n}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK: {n} skills, docs agree")

      - name: Parse manifests
        run: |
          node -e 'for (const f of [".claude-plugin/marketplace.json","plugins/shipkit/.claude-plugin/plugin.json"]) { JSON.parse(require("fs").readFileSync(f,"utf8")); console.log("ok", f); }'

      - name: Syntax-check JavaScript
        run: |
          set -e
          find plugins -type f \( -name '*.mjs' -o -name '*.js' \) \
            -not -path '*/node_modules/*' \
            -not -path 'plugins/shipkit/skills/grill-feature/room-workflow.js' \
            -print0 | while IFS= read -r -d '' f; do
              echo "node --check $f"
              node --check "$f"
            done

      - name: Syntax-check Python
        run: |
          set -e
          find plugins hooks -type f -name '*.py' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -r python -m py_compile
          echo "python ok"

      - name: Syntax-check shell
        run: |
          set -e
          find . -type f -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*' -print0 \
            | while IFS= read -r -d '' f; do
              echo "bash -n $f"
              bash -n "$f"
            done
          for f in hooks/safe-commit/commit-msg hooks/secret-hygiene/pre-commit; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: No personal email addresses
        run: |
          if grep -rInE '[A-Za-z0-9._%+-]+@(gmail|yahoo|outlook|hotmail)\.com' \
               --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo "::error::Personal email address found in the tree (see lines above)."
            exit 1
          fi
          echo "no personal email addresses found"
